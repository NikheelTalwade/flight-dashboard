<div class="dashboard-shell">
  <header class="surface-panel dashboard-header" aria-label="Operations dashboard header">
    <div class="header-branding">
      <div class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 15l20-6-5.5 6.5L14 18l-3-3-9 0 0 0Zm9-7.5 2.2 5.2L22 12l-11 1.2-1.8-4.7Z"/></svg></div>
      <div><div class="eyebrow">Operations command</div><h1>Flight Operations Dashboard</h1></div>
    </div>
    <div class="header-actions">
      <div class="live-indicator" aria-live="polite"><span class="live-dot" [class.is-paused]="!isPlaying()"></span><span class="live-text">{{ isPlaying() ? 'Live tracking' : 'Paused' }}</span></div>
      <div class="clock-wrap"><span class="clock-label">Local time</span><span class="clock-value">{{ currentTime() | date: 'HH:mm:ss' }}</span></div>
      <button class="icon-btn" type="button" (click)="toggleTheme()" [attr.aria-label]="themeLabel()"><span>{{ theme() === 'dark' ? '☀' : '☾' }}</span></button>
    </div>
  </header>
  <div class="status-strip surface-panel"><div class="status-strip__content"><div class="status-pill status-pill--success"><span class="status-topline">Airspace</span><strong>Nominal</strong></div><div class="status-divider"></div><div class="status-summary"><span class="status-label">Visible flights</span><strong>{{ visibleCount() }}</strong></div></div></div>
  <section class="kpi-section" aria-label="Operational KPIs"><app-flight-kpi-cards [items]="kpis()" /></section>
  <app-flight-filters (filteringStarted)="onFilterChangeStarted()" (filtersChange)="onFiltersChange($event)" />
  <section class="controls-strip surface-panel" aria-label="Playback and layer controls">
    <div class="playback-block">
      <button mat-flat-button color="primary" class="btn btn-primary" type="button" (click)="togglePlayback()"><span class="btn-icon">{{ isPlaying() ? '⏸' : '▶' }}</span>{{ isPlaying() ? 'Animation pause' : 'Animation play' }}</button>
      <div class="speed-control" aria-label="Animation speed"><span class="speed-label">Animation speed</span><mat-button-toggle-group class="speed-toggle" [value]="playbackSpeed()" (change)="setPlaybackSpeed($event.value)" aria-label="Animation speed"><mat-button-toggle value="1" aria-label="Normal animation speed">1x</mat-button-toggle><mat-button-toggle value="2" aria-label="Double animation speed">2x</mat-button-toggle><mat-button-toggle value="4" aria-label="Quadruple animation speed">4x</mat-button-toggle></mat-button-toggle-group></div>
    </div>
    <div class="layer-controls">
      <button mat-stroked-button class="layer-toggle-button" [class.is-active]="clusterMarkers" [attr.aria-pressed]="clusterMarkers" aria-label="Toggle flight clustering" type="button" (click)="clusterMarkers = !clusterMarkers"><span class="layer-toggle-content"><span class="layer-toggle-icon layer-toggle-icon--cluster" aria-hidden="true">●</span><span>Cluster</span></span></button>
      <button mat-stroked-button class="layer-toggle-button" [class.is-active]="showAirports" [attr.aria-pressed]="showAirports" aria-label="Toggle airport markers" type="button" (click)="showAirports = !showAirports"><span class="layer-toggle-content"><span class="layer-toggle-icon layer-toggle-icon--airport" aria-hidden="true">⌖</span><span>Airports</span></span></button>
      <button mat-stroked-button class="layer-toggle-button" [class.is-active]="showWeather" [attr.aria-pressed]="showWeather" aria-label="Toggle weather overlay" type="button" (click)="showWeather = !showWeather"><span class="layer-toggle-content"><span class="layer-toggle-icon layer-toggle-icon--weather" aria-hidden="true">☁</span><span>Weather</span></span></button>
    </div>
  </section>
  <main class="content-grid" aria-label="Dashboard layout">
    <div class="map-column"><app-flight-map [flights]="visibleFlights()" [selectedFlightId]="selectedFlightId()" [selectedFlight]="selectedFlight()" [clusterMarkers]="clusterMarkers" [showAirports]="showAirports" [showWeather]="showWeather" [viewportRevision]="mapViewportRevision()" [loading]="mapLoading()" (mapRendered)="onMapRendered()" (selectedFlightChange)="selectFlight($event)" /></div>
    <aside class="sidebar-stack"><app-flight-details [flight]="selectedFlight()" /><app-flight-list [flights]="visibleFlights()" [selectedFlightId]="selectedFlightId()" (flightSelected)="selectFlight($event)" /></aside>
  </main>
  <footer class="dashboard-footer"><span>© 2026 @nikheel-talwade</span><span class="footer-divider">•</span><a href="tel:9591241878">9591241878</a><span class="footer-divider">•</span><a href="mailto:nikheeltalwade.sde@gmail.com">nikheeltalwade.sde@gmail.com</a></footer>
</div>
